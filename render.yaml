services:
  - type: web
    name: bel-naturels-treasury-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bel-naturels-db
          property: connectionString
      - key: JWT_SECRET
        value: bel-naturels-prod-secret-key-2024-xK9mP2
      - key: FRONTEND_URL
        sync: false

databases:
  - name: bel-naturels-db
    plan: free
    databaseName: treasury
